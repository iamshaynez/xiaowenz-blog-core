{{template "head" .}}
{{template "nav"}}
<main>
  <h1>Newsletter</h1>
  <p><a class="btn" href="/admin/newsletters/new">新建</a></p>
  <table>
    <tr><th>主题</th><th>状态</th><th>成功</th><th>失败</th><th>创建</th><th>发送</th><th></th></tr>
    {{range .List}}
    <tr>
      <td><a href="/admin/newsletters/{{.ID}}">{{.Subject}}</a></td>
      <td><span class="badge {{.Status}}">{{.Status}}</span></td>
      <td>{{.SentCount}}</td>
      <td>{{.FailedCount}}</td>
      <td>{{rfc3339 .CreatedAt}}</td>
      <td>{{rfc3339 .SentAt}}</td>
      <td><a href="/admin/newsletters/{{.ID}}">预览/发送</a></td>
    </tr>
    {{else}}<tr><td colspan="7" style="color:#888;">暂无 Newsletter</td></tr>{{end}}
  </table>
</main>
</body></html>

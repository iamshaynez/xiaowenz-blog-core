{{template "head" .}}
{{template "nav"}}
<main>
  <h1>仪表盘</h1>
  <div class="stats">
    <div class="stat"><div class="num">{{.ActiveSubs}}</div><div class="label">订阅（active）</div></div>
    <div class="stat"><div class="num">{{.PendingComments}}</div><div class="label">待审评论</div></div>
    <div class="stat"><div class="num">{{.PV30}}</div><div class="label">近 30 天 PV</div></div>
    <div class="stat"><div class="num">{{.UV30}}</div><div class="label">近 30 天 UV</div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h2 style="font-size:16px;">各剧集近 30 天下载量</h2>
    <table>
      <tr><th>剧集</th><th>下载次数</th></tr>
      {{range $slug, $n := .Downloads}}<tr><td>{{$slug}}</td><td>{{$n}}</td></tr>{{else}}
      <tr><td colspan="2" style="color:#888;">暂无下载记录</td></tr>{{end}}
    </table>
  </div>
</main>
</body></html>

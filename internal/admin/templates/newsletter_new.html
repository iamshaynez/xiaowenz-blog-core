{{template "head" .}}
{{template "nav"}}
<main>
  <h1>新建 Newsletter</h1>
  <div class="card">
    <form method="POST" action="/admin/newsletters">
      <label for="subject">主题</label>
      <input type="text" name="subject" id="subject" required>
      <label for="markdown">正文（Markdown）</label>
      <textarea name="markdown" id="markdown" required></textarea>
      <div style="margin-top:16px;"><button type="submit">保存草稿</button></div>
    </form>
  </div>
  <div class="card" style="margin-top:16px;">
    <form method="POST" action="/admin/newsletters/import">
      <label for="import-url">或从博客文章 URL 生成草稿（文章须已公网上线）</label>
      <input type="url" name="url" id="import-url" placeholder="https://xiaowenz.com/blog/….html" required>
      <div style="margin-top:12px;"><button type="submit">抓取生成草稿</button></div>
    </form>
  </div>
</main>
</body></html>

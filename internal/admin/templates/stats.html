{{template "head" .}}
{{template "nav"}}
<main class="editorial-enter">
  <div class="page-head">
    <span class="kicker">ANALYTICS · 近 30 天</span>
    <h1>统计</h1>
    <div class="actions"><a class="btn ghost small" href="/admin/stats">JSON</a></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v">{{.PV30}}</div><div class="l">PV</div></div>
    <div class="stat"><div class="v">{{.UV30}}</div><div class="l">UV</div></div>
    <div class="stat"><div class="v">{{.ActiveSubs}}</div><div class="l">订阅</div></div>
    <div class="stat"><div class="v">{{.PendingComments}}</div><div class="l">待审评论</div></div>
  </div>
  <div class="card">
    <header><span class="t">剧集下载量</span></header>
    <div class="body">
      {{if .Downloads}}
      <div class="bars">
        {{range .Downloads}}
        <div class="bar-row" data-slug="{{.Slug}}">
          <span class="slug" title="{{.Slug}}">{{.Slug}}</span>
          <span class="track"><span class="fill" style="width:{{.Width}}%"></span></span>
          <span class="n">{{.Count}}</span>
        </div>
        {{end}}
      </div>
      {{else}}<div class="empty">暂无下载记录</div>{{end}}
    </div>
  </div>
</main>
</body></html>

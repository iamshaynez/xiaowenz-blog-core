{{template "head" .}}
{{template "nav"}}
<main>
  <h1>统计（近 30 天）</h1>
  <div class="stats">
    <div class="stat"><div class="num">{{.PV30}}</div><div class="label">PV</div></div>
    <div class="stat"><div class="num">{{.UV30}}</div><div class="label">UV</div></div>
    <div class="stat"><div class="num">{{.ActiveSubs}}</div><div class="label">订阅</div></div>
    <div class="stat"><div class="num">{{.PendingComments}}</div><div class="label">待审评论</div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h2 style="font-size:16px;">剧集下载量</h2>
    <table>
      <tr><th>剧集</th><th>下载次数</th></tr>
      {{range $slug, $n := .Downloads}}<tr><td>{{$slug}}</td><td>{{$n}}</td></tr>{{else}}
      <tr><td colspan="2" style="color:#888;">暂无下载记录</td></tr>{{end}}
    </table>
    <p style="margin-top:12px;"><a href="/admin/stats">JSON 格式</a></p>
  </div>
</main>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>新评论待审核</title></head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#222;">
  <h2>新评论待审核</h2>
  <p><strong>文章：</strong>{{.PostSlug}}<br>
     <strong>作者：</strong>{{.AuthorName}}</p>
  <blockquote style="border-left:3px solid #ddd;margin:16px 0;padding:8px 16px;color:#444;">{{.Content}}</blockquote>
  <p>
    <a href="{{.ApproveURL}}" style="background:#188038;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;">通过</a>
    &nbsp;
    <a href="{{.RejectURL}}" style="background:#d93025;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;">拒绝</a>
  </p>
</body>
</html>

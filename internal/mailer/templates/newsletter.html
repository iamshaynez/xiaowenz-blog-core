<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>三杯过后</title></head>
<body style="font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;margin:0;padding:0;background:#f7f7f7;">
  <div style="max-width:600px;margin:0 auto;background:#fff;padding:36px 32px;color:#222;">
    <header style="border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:28px;">
      <strong style="font-size:15px;letter-spacing:.05em;">三杯过后</strong>
      <span style="font-size:12px;color:#888;"> · 专栏博客文章订阅</span>
    </header>
    {{if .Title}}<h1 style="font-size:24px;line-height:1.45;margin:0 0 24px;font-weight:700;">{{.Title}}</h1>{{end}}
    <main style="font-size:16px;">{{.BodyHTML}}</main>
    {{if .PostURL}}<p style="margin:32px 0 0;">
      <a href="{{.PostURL}}" style="display:inline-block;background:#222;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-size:15px;">阅读原文</a>
    </p>{{end}}
    <footer style="border-top:1px solid #ddd;margin-top:36px;padding-top:16px;color:#888;font-size:12px;line-height:1.7;">
      <p style="margin:0 0 4px;">你收到本邮件是因为订阅了「三杯过后」专栏博客文章订阅。</p>
      <p style="margin:0 0 8px;"><a href="{{.UnsubURL}}" style="color:#888;">退订本通讯</a></p>
      <p style="margin:0;">{{.MailingAddress}}</p>
    </footer>
  </div>
</body>
</html>

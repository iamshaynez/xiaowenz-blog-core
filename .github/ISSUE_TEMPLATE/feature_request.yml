name: Feature request
description: Suggest an idea
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user-visible need, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the behavior be? Note this project is dependency-minimal and TDD-first (see AGENTS.md).

# hk-dev 服务器 /opt/apps/core/docker-compose.yml 的版本化副本——改动两处同步。
# 服务器布局：/opt/apps/core/{docker-compose.yml, build.sh, deploy.sh,
#   env(CORE_* 环境变量含机密,600,勿入库勿回显), .env(仅 ACR_REGISTRY), data/, src/}
# 镜像来自阿里云 ACR（与 sanguo / novel-universe 同实例，命名空间 xiaowenz）。
# 2026-11-07 自 gb-test 迁入 hk-dev（目录布局不变，apps 网段 172.19.0.0/16）。
# ⚠ 迁移教训：CORE_TRUSTED_PROXIES 必须覆盖 docker 实际网段（现配 172.16.0.0/12
#   + Cloudflare 全量网段）；网段对不上时 XFF 不被采信，UV/下载计数会全员塌缩成
#   单一反代 IP（2026-11-07~09 事故，详见总仓 AGENTS.md 2026-11-10 条目）。
# 接入层：openresty 反代 core.xiaowenz.com → 容器名 xiaowenz-core:8080，经共享
# apps 网络；本机 18092 回环端口留作 deploy.sh 冒烟与运维后门。
# 数据：./data bind mount → /data（SQLite core.db + WAL），重建容器不丢。
services:
  core:
    image: ${ACR_REGISTRY}/xiaowenz/core:main
    container_name: xiaowenz-core
    restart: unless-stopped
    env_file: env
    ports:
      - "127.0.0.1:18092:8080"   # 只绑回环：对外一律走 openresty/CF
    volumes:
      - ./data:/data
networks:
  default:
    name: apps
    external: true
